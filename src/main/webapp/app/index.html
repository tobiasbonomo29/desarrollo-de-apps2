<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediConecta — Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pagina="inicio" data-titulo="Inicio" data-subtitulo="Resumen de la actividad de hoy">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="contenido">
        <header class="topbar" id="topbar"></header>

        <main class="vista">

            <!-- Vista de recepción / médico / administración -->
            <div id="panel-equipo" hidden>
                <section class="grilla-metricas" id="metricas"></section>

                <section class="columnas">
                    <div class="card">
                        <div class="card__cabecera">
                            <div>
                                <h2>Próximos turnos</h2>
                                <p>Los siguientes turnos programados de la clínica.</p>
                            </div>
                            <a class="boton boton--chico" href="turno-nuevo.html" id="boton-nuevo-turno" hidden>+ Nuevo turno</a>
                        </div>
                        <div id="proximos"></div>
                    </div>

                    <div class="card">
                        <div class="card__cabecera">
                            <div>
                                <h2>Estado de agenda</h2>
                                <p>Turnos por profesional para hoy.</p>
                            </div>
                        </div>
                        <div id="agenda"></div>
                    </div>
                </section>
            </div>

            <!-- Vista del paciente -->
            <div id="panel-paciente" hidden>
                <section class="columnas">
                    <div class="card">
                        <div class="card__cabecera">
                            <div>
                                <h2>Mis turnos</h2>
                                <p>Tus próximos turnos y tu historial.</p>
                            </div>
                            <div class="acciones">
                                <a class="boton boton--secundario boton--chico" href="mis-turnos.html">Ver todos</a>
                                <a class="boton boton--chico" href="reserva.html">Reservar turno</a>
                            </div>
                        </div>
                        <div id="mis-turnos"></div>
                    </div>

                    <div class="card">
                        <div class="card__cabecera">
                            <div>
                                <h2>Mis datos</h2>
                                <p>Ficha registrada en la clínica.</p>
                            </div>
                        </div>
                        <div id="mi-ficha"></div>
                    </div>
                </section>
            </div>

            <div id="carga" class="cargando">Cargando el tablero...</div>

        </main>
    </div>
</div>

<nav class="nav-inferior" id="nav-inferior"></nav>
<div id="avisos"></div>

<script type="module" src="../js/dashboard.js"></script>
</body>
</html>
