<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediConecta — Detalle del turno</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pagina="turnos" data-titulo="Detalle del turno" data-subtitulo="Información completa de la atención">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="contenido">
        <header class="topbar" id="topbar"></header>

        <main class="vista">
            <section class="columnas">
                <div class="card">
                    <div class="card__cabecera">
                        <div>
                            <h2 id="titulo">Turno</h2>
                            <p id="subtitulo"></p>
                        </div>
                        <span id="estado"></span>
                    </div>
                    <div id="detalle"></div>
                </div>

                <div class="card">
                    <div class="card__cabecera">
                        <div>
                            <h2>Acciones</h2>
                        </div>
                    </div>
                    <div id="mensaje" class="aviso aviso--info" hidden></div>
                    <div class="acciones">
                        <a class="boton boton--secundario" id="enlace-volver" href="turnos.html">Volver a turnos</a>
                        <button type="button" class="boton" id="boton-atender" hidden>
                            Marcar atendido
                        </button>
                        <button type="button" class="boton boton--peligro" id="boton-cancelar" hidden>
                            Cancelar turno
                        </button>
                        <button type="button" class="boton boton--peligro" id="boton-archivar" hidden>
                            Eliminar de agenda
                        </button>
                    </div>
                    <p class="campo__ayuda u-mt-12" id="nota-permisos"></p>
                </div>
            </section>

            <section class="card u-mt-24">
                <div class="card__cabecera">
                    <div>
                        <h2>Avisos enviados</h2>
                        <p>Los generan los consumidores JMS (cola y tópico) al confirmarse el turno.</p>
                    </div>
                </div>
                <div id="avisos-turno"></div>
            </section>
        </main>
    </div>
</div>

<nav class="nav-inferior" id="nav-inferior"></nav>
<div id="avisos"></div>

<script type="module" src="../js/turno-detalle.js"></script>
</body>
</html>
